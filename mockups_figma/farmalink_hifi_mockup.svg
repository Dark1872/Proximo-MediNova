    <text x="176" y="28" font-size="12" font-weight="600" fill="#0F172A">farmalink.com.co</text>
    <text x="282" y="28" font-size="12" fill="#64748B">/buscar?q=acetaminofen+500mg&amp;ciudad=bogota</text>

