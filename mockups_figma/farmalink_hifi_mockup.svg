<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .brand-title { font-size: 22px; font-weight: 800; fill: #0A1628; letter-spacing: -0.5px; }
      .nav-item { font-size: 14px; font-weight: 600; fill: #334155; }
      .nav-item-active { font-size: 14px; font-weight: 700; fill: #16A34A; }
      .hero-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; fill: #166534; }
      .hero-title { font-size: 34px; font-weight: 800; fill: #0F172A; letter-spacing: -1px; }
      .hero-subtitle { font-size: 15px; font-weight: 400; fill: #475569; line-height: 1.5; }
      .card-name { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .card-desc { font-size: 12px; font-weight: 500; fill: #64748B; }
      .card-price { font-size: 18px; font-weight: 800; fill: #15803D; letter-spacing: -0.3px; }
      .badge-txt { font-size: 11px; font-weight: 700; }
      .btn-txt-white { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .tbl-header { font-size: 11px; font-weight: 700; fill: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>

    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="pill-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <linearGradient id="pill-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-modal" x="-10%" y="-5%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="shadow-card-hover" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#22C55E" flood-opacity="0.35"/>
