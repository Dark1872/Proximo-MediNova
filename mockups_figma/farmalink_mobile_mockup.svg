<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="420" height="880">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .brand-title { font-size: 22px; font-weight: 800; fill: #0A1628; letter-spacing: -0.5px; }
      .nav-item { font-size: 14px; font-weight: 600; fill: #334155; }
      .nav-item-active { font-size: 14px; font-weight: 700; fill: #16A34A; }
      .hero-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; fill: #166534; }
      .hero-title { font-size: 34px; font-weight: 800; fill: #0F172A; letter-spacing: -1px; }
      .hero-subtitle { font-size: 15px; font-weight: 400; fill: #475569; line-height: 1.5; }
      .card-name { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .card-desc { font-size: 12px; font-weight: 500; fill: #64748B; }
      .card-price { font-size: 18px; font-weight: 800; fill: #15803D; letter-spacing: -0.3px; }
      .badge-txt { font-size: 11px; font-weight: 700; }
      .btn-txt-white { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .tbl-header { font-size: 11px; font-weight: 700; fill: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>

    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="pill-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <linearGradient id="pill-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-modal" x="-10%" y="-5%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="shadow-card-hover" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#22C55E" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Phone Body -->
  <rect x="10" y="10" width="400" height="860" rx="50" fill="#0F172A" filter="url(#shadow-modal)"/>
  <rect x="16" y="16" width="388" height="848" rx="44" fill="#FFFFFF"/>

  <!-- Dynamic Island -->
  <rect x="145" y="26" width="130" height="32" rx="16" fill="#000000"/>
  <circle cx="250" cy="42" r="5" fill="#1E293B"/>

  <!-- Mobile Screen Content Area (clip rounded corners) -->
  <g transform="translate(16, 16)">
    <!-- Status Bar -->
    <text x="35" y="32" font-size="13" font-weight="700" fill="#0F172A">9:41</text>
    <text x="325" y="32" font-size="12" fill="#0F172A">📶 🔋</text>

    <!-- Top App Bar -->
    <g transform="translate(20, 60)">
      <rect width="32" height="32" rx="8" fill="url(#primary-grad)"/>
      <path d="M 16 9 L 16 23 M 9 16 L 23 16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="40" y="22" font-size="18" font-weight="800" fill="#0A1628">Farmalink<tspan fill="#16A34A">.co</tspan></text>
      
      <!-- Cart Icon -->
      <circle cx="320" cy="16" r="16" fill="#F1F5F9"/>
      <text x="312" y="21" font-size="13">🛒</text>
      <circle cx="330" cy="8" r="6" fill="#EF4444"/>
      <text x="328" y="12" font-size="8" font-weight="800" fill="#FFFFFF">2</text>
    </g>

    <!-- Search Bar Mobile -->
    <g transform="translate(20, 110)">
      <rect width="348" height="48" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="20" y="30" font-size="13" fill="#64748B">🔍 Buscar medicina o síntoma...</text>
    </g>

    <!-- Location Pill -->
    <g transform="translate(20, 170)">
      <rect width="210" height="28" rx="14" fill="#DCFCE7"/>
      <text x="14" y="19" font-size="11" font-weight="700" fill="#15803D">📍 Bogotá • Chapinero (GPS)</text>
    </g>

    <!-- Best Deal Hero Card -->
    <g transform="translate(20, 210)">
      <rect width="348" height="150" rx="16" fill="url(#hero-bg)" stroke="#BBF7D0" stroke-width="1.5"/>
      <text x="18" y="30" font-size="11" font-weight="800" fill="#15803D">OFERTA DEL DÍA • 38% OFF</text>
      <text x="18" y="55" font-size="17" font-weight="800" fill="#0F172A">Acetaminofén 500mg</text>
      <text x="18" y="74" font-size="12" fill="#64748B">Genfar • 100 Tabletas</text>
      
      <text x="18" y="110" font-size="12" fill="#64748B">Desde:</text>
      <text x="18" y="132" font-size="20" font-weight="800" fill="#15803D">$4.800 COP</text>

      <rect x="220" y="98" width="112" height="38" rx="12" fill="url(#primary-grad)"/>
      <text x="240" y="122" font-size="12" font-weight="700" fill="#FFFFFF">Comparar</text>
    </g>

    <!-- Nearby Pharmacies List Title -->
    <text x="20" y="390" font-size="15" font-weight="800" fill="#0F172A">Farmacias con mejor precio</text>
    
    <!-- Pharmacy 1 -->
    <g transform="translate(20, 405)">
      <rect width="348" height="75" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <circle cx="30" cy="37" r="16" fill="#15803D"/>
      <text x="24" y="42" font-size="10" font-weight="800" fill="#FFFFFF">SJ</text>
      <text x="56" y="30" font-size="13" font-weight="800" fill="#0F172A">Droguería San Jorge</text>
      <text x="56" y="48" font-size="11" fill="#15803D">📍 A 800m • Abierto ahora</text>
      <text x="56" y="64" font-size="14" font-weight="800" fill="#15803D">$4.800 COP</text>
      <rect x="250" y="22" width="85" height="32" rx="8" fill="#15803D"/>
      <text x="264" y="42" font-size="11" font-weight="700" fill="#FFFFFF">Ir al mapa</text>
    </g>

    <!-- Pharmacy 2 -->
    <g transform="translate(20, 490)">
      <rect width="348" height="75" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="30" cy="37" r="16" fill="#0284C7"/>
      <text x="24" y="42" font-size="10" font-weight="800" fill="#FFFFFF">FT</text>
      <text x="56" y="30" font-size="13" font-weight="800" fill="#0F172A">Farmatodo Cl. 72</text>
      <text x="56" y="48" font-size="11" fill="#64748B">📍 A 1.3 km • 24 Horas</text>
      <text x="56" y="64" font-size="14" font-weight="800" fill="#0F172A">$5.400 COP</text>
      <rect x="250" y="22" width="85" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="268" y="42" font-size="11" font-weight="700" fill="#334155">Ver oferta</text>
    </g>

    <!-- Pharmacy 3 -->
    <g transform="translate(20, 575)">
      <rect width="348" height="75" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="30" cy="37" r="16" fill="#10B981"/>
      <text x="24" y="42" font-size="10" font-weight="800" fill="#FFFFFF">CV</text>
      <text x="56" y="30" font-size="13" font-weight="800" fill="#0F172A">Cruz Verde Calle 85</text>
      <text x="56" y="48" font-size="11" fill="#64748B">📍 A 2.1 km • Cierra 9pm</text>
      <text x="56" y="64" font-size="14" font-weight="800" fill="#0F172A">$6.100 COP</text>
      <rect x="250" y="22" width="85" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="268" y="42" font-size="11" font-weight="700" fill="#334155">Ver oferta</text>
    </g>

    <!-- Floating Bot Button -->
    <g transform="translate(315, 685)">
      <circle cx="26" cy="26" r="24" fill="url(#primary-grad)" filter="url(#shadow-card-hover)"/>
      <text x="16" y="32" font-size="18">💬</text>
    </g>

    <!-- Bottom Navigation Bar (iOS Tabbar) -->
    <g transform="translate(0, 765)">
      <rect width="388" height="83" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Tab 1 Active -->
      <text x="45" y="32" font-size="18">🏠</text>
      <text x="40" y="48" font-size="10" font-weight="800" fill="#16A34A">Inicio</text>
      <!-- Tab 2 -->
      <text x="125" y="32" font-size="18">💊</text>
      <text x="105" y="48" font-size="10" font-weight="600" fill="#64748B">Catálogo</text>
      <!-- Tab 3 -->
      <text x="205" y="32" font-size="18">🗺️</text>
      <text x="200" y="48" font-size="10" font-weight="600" fill="#64748B">Mapa</text>
      <!-- Tab 4 -->
      <text x="285" y="32" font-size="18">👤</text>
      <text x="280" y="48" font-size="10" font-weight="600" fill="#64748B">Perfil</text>
      
      <!-- Home Indicator Bar -->
      <rect x="124" y="68" width="140" height="5" rx="2.5" fill="#000000"/>
    </g>
  </g>
</svg>