<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .wf-box { fill: #FFFFFF; stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
      .wf-box-gray { fill: #F1F5F9; stroke: #000000; stroke-width: 1.5; stroke-linejoin: round; }
      .wf-line { stroke: #000000; stroke-width: 1.5; }
      .wf-line-bold { stroke: #000000; stroke-width: 2; }
      .wf-text { fill: #000000; font-size: 13px; }
      .wf-text-title { fill: #000000; font-size: 16px; font-weight: 700; }
      .wf-text-bold { fill: #000000; font-size: 13px; font-weight: 700; }
      .wf-link { fill: #2563EB; font-size: 12px; font-weight: 500; text-decoration: underline; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="950" fill="#FFFFFF"/>

  <!-- Logo Box with Cross -->
  <g id="logo-box">
    <rect x="30" y="30" width="240" height="100" class="wf-box"/>
    <line x1="30" y1="30" x2="270" y2="130" class="wf-line-bold"/>
    <line x1="270" y1="30" x2="30" y2="130" class="wf-line-bold"/>
    <rect x="75" y="65" width="150" height="30" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text x="90" y="86" font-size="14" font-weight="700" fill="#000000">LOGO / FARMALINK</text>
  </g>

  <!-- Top Right Header Navigation -->
  <g id="header-top-right">
    <!-- View Cart & Order History -->
    <text x="880" y="45" class="wf-text" font-weight="500">View Cart</text>
    <text x="965" y="45" class="wf-text" font-weight="500">Order History</text>

    <!-- Search Input & Button -->
    <rect x="690" y="65" width="260" height="28" class="wf-box"/>
    <text x="702" y="84" font-size="12" fill="#64748B">Products, Parts, Keywords Search</text>

    <rect x="960" y="65" width="75" height="28" rx="14" class="wf-box"/>
    <text x="978" y="84" font-size="12" font-weight="600" fill="#000000">Search</text>

    <!-- Nav Links Row -->
    <g transform="translate(290, 125)">
      <text x="0" y="0" class="wf-link">Home</text>
      <text x="36" y="0" font-size="12" font-weight="700" fill="#000000">|</text>
      <text x="52" y="0" class="wf-link">About Us</text>
      <text x="116" y="0" font-size="12" font-weight="700" fill="#000000">|</text>
      <text x="132" y="0" class="wf-link">Products</text>
      <text x="196" y="0" font-size="12" font-weight="700" fill="#000000">|</text>
      <text x="212" y="0" class="wf-link">Blog</text>
      <text x="248" y="0" font-size="12" font-weight="700" fill="#000000">|</text>
      <text x="264" y="0" class="wf-link">News</text>
      <text x="300" y="0" font-size="12" font-weight="700" fill="#000000">|</text>
      <text x="316" y="0" class="wf-link">Support</text>
      <text x="373" y="0" font-size="12" font-weight="700" fill="#000000">|</text>
      <text x="389" y="0" class="wf-link">Contact</text>
      <text x="780" y="0" font-size="13" font-weight="600" fill="#000000">800-888-8888</text>
    </g>
  </g>

  <!-- Sidebar Categories & Main Hero Banner -->
  <g id="middle-section">
    <!-- Left Sidebar (Stacked Rectangles) -->
    <g id="category-sidebar" transform="translate(30, 150)">
      <rect x="0" y="0" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="23" font-size="12" font-weight="600" fill="#000000">Rainfall Sensors</text>
      <rect x="0" y="37" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="60" font-size="12" font-weight="600" fill="#000000">Wind Anemometer</text>
      <rect x="0" y="74" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="97" font-size="12" font-weight="600" fill="#000000">Weather Stations</text>
      <rect x="0" y="111" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="134" font-size="12" font-weight="600" fill="#000000">Controllers</text>
      <rect x="0" y="148" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="171" font-size="12" font-weight="600" fill="#000000">Indicators/Displays</text>
      <rect x="0" y="185" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="208" font-size="12" font-weight="600" fill="#000000">Temp/Humidity Sensors</text>
      <rect x="0" y="222" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="245" font-size="12" font-weight="600" fill="#000000">Barometric Pressure</text>
      <rect x="0" y="259" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="282" font-size="12" font-weight="600" fill="#000000">Solar Radiation</text>
      <rect x="0" y="296" width="215" height="37" class="wf-box-gray"/>
      <text x="12" y="319" font-size="12" font-weight="600" fill="#000000">Replacement Parts</text>
    </g>

    <!-- Right Large Banner with Cross -->
    <g id="main-banner" transform="translate(260, 150)">
      <rect x="0" y="0" width="910" height="333" class="wf-box"/>
      <line x1="0" y1="0" x2="910" y2="333" class="wf-line-bold"/>
      <line x1="910" y1="0" x2="0" y2="333" class="wf-line-bold"/>
      <rect x="360" y="146" width="200" height="40" rx="6" fill="#FFFFFF" opacity="0.92"/>
      <text x="382" y="171" font-size="15" font-weight="700" fill="#000000">MAIN BANNER / HERO</text>
    </g>
  </g>

  <!-- Featured Products Section -->
  <g id="featured-products-section" transform="translate(30, 508)">
    <!-- Title Bar -->
    <rect x="0" y="0" width="700" height="34" class="wf-box"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#000000">Featured Products</text>

    <!-- 2x2 Product Grid (Left) -->
    <g transform="translate(0, 48)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="342" height="145" class="wf-box"/>
        
        <!-- Image Box with X -->
        <rect x="10" y="10" width="125" height="125" class="wf-box"/>
        <line x1="10" y1="10" x2="135" y2="135" class="wf-line"/>
        <line x1="135" y1="10" x2="10" y2="135" class="wf-line"/>

        <!-- Details -->
        <text x="145" y="32" class="wf-text-title">Product Title</text>
        <text x="145" y="54" font-size="12" font-weight="600" fill="#475569">SKU</text>
        <text x="145" y="72" font-size="11" fill="#334155">Lorem ipsum dolor sit amet, consect</text>
        <text x="145" y="88" font-size="11" fill="#334155">etur adipiscing elit.</text>

        <!-- Button -->
        <rect x="145" y="102" width="125" height="28" rx="14" class="wf-box-gray"/>
        <text x="165" y="121" font-size="12" font-weight="700" fill="#000000">More Info »</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(358, 0)">
        <rect x="0" y="0" width="342" height="145" class="wf-box"/>
        
        <!-- Image Box with X -->
        <rect x="10" y="10" width="125" height="125" class="wf-box"/>
        <line x1="10" y1="10" x2="135" y2="135" class="wf-line"/>
        <line x1="135" y1="10" x2="10" y2="135" class="wf-line"/>

        <!-- Details -->
        <text x="145" y="32" class="wf-text-title">Product Title</text>
        <text x="145" y="54" font-size="12" font-weight="600" fill="#475569">SKU</text>
        <text x="145" y="72" font-size="11" fill="#334155">Lorem ipsum dolor sit amet, consect</text>
        <text x="145" y="88" font-size="11" fill="#334155">etur adipiscing elit.</text>

        <!-- Button -->
        <rect x="145" y="102" width="125" height="28" rx="14" class="wf-box-gray"/>
        <text x="165" y="121" font-size="12" font-weight="700" fill="#000000">More Info »</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(0, 161)">
        <rect x="0" y="0" width="342" height="145" class="wf-box"/>
        
        <!-- Image Box with X -->
        <rect x="10" y="10" width="125" height="125" class="wf-box"/>
        <line x1="10" y1="10" x2="135" y2="135" class="wf-line"/>
        <line x1="135" y1="10" x2="10" y2="135" class="wf-line"/>

        <!-- Details -->
        <text x="145" y="32" class="wf-text-title">Product Title</text>
        <text x="145" y="54" font-size="12" font-weight="600" fill="#475569">SKU</text>
        <text x="145" y="72" font-size="11" fill="#334155">Lorem ipsum dolor sit amet, consect</text>
        <text x="145" y="88" font-size="11" fill="#334155">etur adipiscing elit.</text>

        <!-- Button -->
        <rect x="145" y="102" width="125" height="28" rx="14" class="wf-box-gray"/>
        <text x="165" y="121" font-size="12" font-weight="700" fill="#000000">More Info »</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(358, 161)">
        <rect x="0" y="0" width="342" height="145" class="wf-box"/>
        
        <!-- Image Box with X -->
        <rect x="10" y="10" width="125" height="125" class="wf-box"/>
        <line x1="10" y1="10" x2="135" y2="135" class="wf-line"/>
        <line x1="135" y1="10" x2="10" y2="135" class="wf-line"/>

        <!-- Details -->
        <text x="145" y="32" class="wf-text-title">Product Title</text>
        <text x="145" y="54" font-size="12" font-weight="600" fill="#475569">SKU</text>
        <text x="145" y="72" font-size="11" fill="#334155">Lorem ipsum dolor sit amet, consect</text>
        <text x="145" y="88" font-size="11" fill="#334155">etur adipiscing elit.</text>

        <!-- Button -->
        <rect x="145" y="102" width="125" height="28" rx="14" class="wf-box-gray"/>
        <text x="165" y="121" font-size="12" font-weight="700" fill="#000000">More Info »</text>
      </g>
    </g>

    <!-- Right Side Tall Promo Box -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="420" height="354" class="wf-box"/>
      <rect x="130" y="157" width="160" height="40" rx="6" fill="#F1F5F9"/>
      <text x="148" y="182" font-size="14" font-weight="700" fill="#475569">SIDEBAR / AD</text>
    </g>
  </g>

  <!-- Black Footer Bar -->
  <rect x="30" y="887" width="1140" height="34" fill="#000000"/>
</svg>