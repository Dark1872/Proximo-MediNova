          <rect x="15" y="80" width="320" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
          <text x="120" y="96" font-size="10" font-weight="600" fill="#475569">Ver detalles en mapa</text>
        </g>
